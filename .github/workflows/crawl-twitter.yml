name: Crawl Twitter Images

on:
  push:
    branches: [main]
    paths: ['artifacts/skipped-video-recovery.json']
  schedule:
    # Run every 3 hours at minute 07 UTC (09:07 HKT, then 12:07, etc.).
    - cron: "7 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      retry_skipped_videos:
        description: 'Recover posts listed in artifacts/skipped-video-recovery.json'
        type: boolean
        default: false
      crawl_all:
        description: 'Crawl all historical images (ignores the latest-only limit)'
        type: boolean
        default: false
      fix_links:
        description: 'Run post links repair script to fix rounded tweet IDs'
        type: boolean
        default: false

# Lock the whole workflow; its two shards may run together inside this lock.
concurrency:
  group: gallery-media-mutations
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    environment: env
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
      plan_artifact: ${{ steps.plan_artifact.outputs.artifact-id }}
      xtractor_version: ${{ steps.xtractor_version.outputs.version }}
    env:
      TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CRAWL_API_KEY: ${{ secrets.CRAWL_API_KEY }}
      CRAWL_RUN_TYPE: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
      CRAWL_RECOVERY_FILE: ${{ (github.event_name == 'push' || inputs.retry_skipped_videos) && 'artifacts/skipped-video-recovery.json' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache xtractor dedup archive
        if: ${{ !inputs.fix_links }}
        uses: actions/cache/restore@v4
        with:
          path: scripts/.xtractor-archive.json
          key: xtractor-archive-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xtractor-archive-v1-

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve xtractor version
        id: xtractor_version
        run: echo "version=$(node scripts/xtractor-lib.mjs --print-version)" >> "$GITHUB_OUTPUT"

      - name: Cache xtractor binary
        uses: actions/cache@v4
        with:
          path: scripts/.xtractor-bin
          key: xtractor-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.xtractor_version.outputs.version }}

      - name: Detect accounts needing updates
        if: ${{ !inputs.fix_links }}
        id: detect
        env:
          CRAWL_ALL: ${{ inputs.crawl_all }}
        run: |
          if [ -n "$CRAWL_RECOVERY_FILE" ]; then
            node --input-type=module -e '
              for (let attempt = 0; attempt < 90; attempt++) {
                const ready = await fetch(process.env.SITE_URL + "/api/crawl-upload-file", { signal: AbortSignal.timeout(10000) })
                  .then(r => r.json()).then(d => d.multipart === true && d.maxFileBytes === 1000000000).catch(() => false);
                if (ready) process.exit(0);
                if (attempt % 6 === 0) console.log("Waiting for multipart upload deployment...");
                await new Promise(r => setTimeout(r, 10000));
              }
              throw new Error("Multipart upload deployment did not become ready");
            '
          fi
          args=(--detect)
          if [ "$CRAWL_ALL" = "true" ]; then args+=(--all); fi
          node scripts/crawl-twitter.mjs "${args[@]}"

      - name: Share detected media and archive baseline
        if: ${{ !inputs.fix_links }}
        id: plan_artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-plan-${{ github.run_attempt }}
          path: scripts/.crawl-plan.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Run links repair script
        if: ${{ inputs.fix_links }}
        run: npm run fix-links

  crawl:
    needs: detect
    if: ${{ !inputs.fix_links && needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    environment: env
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CRAWL_API_KEY: ${{ secrets.CRAWL_API_KEY }}
      CRAWL_RUN_TYPE: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
      CRAWL_RECOVERY_FILE: ${{ (github.event_name == 'push' || inputs.retry_skipped_videos) && 'artifacts/skipped-video-recovery.json' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download detected work
        id: plan_download
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.detect.outputs.plan_artifact }}
          merge-multiple: true
          path: scripts/

      - name: Restore xtractor for historical or recovery work
        if: ${{ matrix.full }}
        uses: actions/cache/restore@v4
        with:
          path: scripts/.xtractor-bin
          key: xtractor-bin-${{ runner.os }}-${{ runner.arch }}-${{ needs.detect.outputs.xtractor_version }}

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore installed Pillow environment
        id: pillow_cache
        uses: actions/cache/restore@v4
        with:
          path: .crawl-venv
          key: pillow-venv-v1-ubuntu24-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/crawl-requirements.txt') }}

      - name: Install Pillow on cache miss
        if: ${{ steps.pillow_cache.outputs.cache-hit != 'true' }}
        run: |
          python -m venv .crawl-venv
          .crawl-venv/bin/python -m pip install -r scripts/crawl-requirements.txt

      - name: Save installed Pillow environment
        if: ${{ steps.pillow_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .crawl-venv
          key: ${{ steps.pillow_cache.outputs.cache-primary-key }}

      - name: Activate cached Python environment
        run: echo "$GITHUB_WORKSPACE/.crawl-venv/bin" >> "$GITHUB_PATH"

      - name: Set up FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Crawl assigned accounts
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/crawl-twitter.mjs --plan=scripts/.crawl-plan.json --shard="$SHARD"

      - name: Snapshot partial progress
        if: ${{ always() && steps.plan_download.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/crawl-plan.mjs --snapshot "$SHARD"

      - name: Preserve shard progress
        if: ${{ always() && hashFiles('scripts/.crawl-shard-archive.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: crawl-archive-${{ matrix.shard }}-${{ github.run_attempt }}
          path: scripts/.crawl-shard-archive.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: [detect, crawl]
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: env
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download archive baseline
        if: ${{ !inputs.fix_links }}
        id: plan_download
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.detect.outputs.plan_artifact }}
          merge-multiple: true
          path: scripts/

      - name: Download shard progress from all attempts
        if: ${{ !inputs.fix_links && needs.detect.outputs.count != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: crawl-archive-*
          path: scripts/.crawl-results/

      - name: Merge completed and partial shard progress
        if: ${{ always() && !inputs.fix_links && steps.plan_download.outcome == 'success' }}
        run: node scripts/crawl-plan.mjs --merge

      - name: Save xtractor dedup archive including partial progress
        if: ${{ always() && !inputs.fix_links && hashFiles('scripts/.xtractor-archive.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: scripts/.xtractor-archive.json
          key: xtractor-archive-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run daily cleanup for pending review images
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ]; then
            curl --fail-with-body --show-error --max-time 60 -X POST "${SITE_URL}/api/cron-cleanup" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}"
          else
            echo "Skipping cleanup: SITE_URL or CRON_SECRET is not configured"
          fi

      - name: Require all crawl workers to succeed
        if: ${{ always() && !inputs.fix_links }}
        env:
          ACCOUNT_COUNT: ${{ needs.detect.outputs.count }}
          WORKER_RESULT: ${{ needs.crawl.result }}
        run: |
          if [ "$ACCOUNT_COUNT" != "0" ]; then test "$WORKER_RESULT" = success; fi
