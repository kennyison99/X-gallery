name: CI Quality & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Run test suite
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '42262e62f0ff1107d0eb78d92a94d873'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Wrangler deploy dry-run validation
        run: npx wrangler deploy --dry-run

      - name: Preserve Worker build on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-build-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  verify:
    if: ${{ always() }}
    needs: [tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and build to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success
