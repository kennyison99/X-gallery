name: CI Quality & Build Verification

on:
  push:
    branches: [main, 'feature/*', 'perf/*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Run test suite
        run: npm test

      - name: Build Astro project
        env:
          CLOUDFLARE_ACCOUNT_ID: '42262e62f0ff1107d0eb78d92a94d873'
        run: npm run build

      - name: Wrangler deploy dry-run validation
        env:
          CLOUDFLARE_ACCOUNT_ID: '42262e62f0ff1107d0eb78d92a94d873'
        run: npx wrangler deploy --dry-run

      - name: Preserve verified Worker build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: worker-build-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
