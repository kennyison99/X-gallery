name: Deduplicate Media

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete verified duplicate cards and R2 objects'
        required: true
        type: boolean
        default: false

concurrency:
  group: gallery-media-mutations
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan duplicate media
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRAWL_API_KEY: ${{ secrets.CRAWL_API_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          npm run dedup-media -- "${args[@]}"
